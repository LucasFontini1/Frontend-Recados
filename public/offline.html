<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a4c34" />
  <title>Sem conexão - Recados</title>
  <style>
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; background: #f4f4f6; color: #18332a; font-family: system-ui, sans-serif; }
    main { max-width: 420px; padding: 32px; text-align: center; background: #fff; border-radius: 16px; box-shadow: 0 4px 22px #163a2c1a; }
    h1 { color: #0a4c34; }
    p { line-height: 1.7; }
    button { padding: 12px 20px; border: none; border-radius: 8px; color: #fff; background: #0a4c34; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Você está sem conexão</h1>
    <p>O Recados precisa de internet para atualizar eventos, avisos e informações da sua conta. Verifique sua conexão e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
